<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мирталис</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #12121a;
    --panel: #1c1c28;
    --panel-2: #242434;
    --border: #2e2e42;
    --text: #e4e4ef;
    --text-dim: #8a8aa0;
    --accent: #7c5cff;
    --accent-hover: #9078ff;
    --error: #ff5c6c;
    --success: #4ade80;
    --warning: #ffb86b;
    --gold: #ffd166;
    --fired: #55556a;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    line-height: 1.4;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar .date-line {
    font-size: 0.9rem;
    color: var(--text-dim);
    letter-spacing: 0.3px;
  }
  .topbar .date-line strong { color: var(--text); font-weight: 600; }

  .main-menu {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    padding: 24px 16px;
    max-width: 760px;
    margin: 0 auto;
  }
  .main-menu button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 18px 28px;
    font-size: 1.05rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    min-width: 130px;
  }
  .main-menu button:hover {
    background: var(--panel-2);
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
    overflow-y: auto;
    z-index: 200;
  }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 680px;
    position: relative;
    animation: fadeIn 0.15s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  .modal h2 {
    font-size: 1.2rem;
    color: var(--accent);
    margin-bottom: 18px;
  }
  .modal-close {
    position: absolute;
    top: 12px;
    right: 14px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 1.4rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .modal-close:hover { color: var(--text); background: var(--panel-2); }

  .row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  input, select {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 9px 11px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    width: 100%;
    transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input[type=number] { -moz-appearance: textfield; }
  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.9rem;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover { background: var(--accent-hover); }
  button:active { transform: scale(0.98); }
  button.secondary {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
  }
  button.secondary:hover { background: #2e2e44; }
  button.small { padding: 6px 12px; font-size: 0.8rem; }
  button.danger { background: #b03040; }
  button.danger:hover { background: #d04050; }
  button.success-btn { background: #2f8f4e; }
  button.success-btn:hover { background: #3aa860; }
  button.warn { background: #b06a20; }
  button.warn:hover { background: #d08030; }

  .error {
    color: var(--error);
    font-size: 0.82rem;
    min-height: 1.1em;
    margin-top: 4px;
  }
  .hint { font-size: 0.75rem; color: var(--text-dim); margin-top: 3px; }

  .member-list { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
  .member-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .member-row.fired {
    background: #1a1a22;
    border-color: #2a2a38;
  }
  .member-row.fired .member-name { color: var(--fired); text-decoration: line-through; }
  .member-row.fired .member-role { background: rgba(85,85,106,0.2); color: var(--fired); }

  .member-row .member-name { font-weight: 600; }
  .member-row .member-role {
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(124,92,255,0.15);
    color: var(--accent);
    margin-left: 8px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .member-row .role-manager { background: rgba(255,209,102,0.15); color: var(--gold); }
  .member-row .role-player { background: rgba(74,222,128,0.15); color: var(--success); }
  .member-row .role-employee { background: rgba(124,92,255,0.15); color: var(--accent); }
  .member-row .role-merc { background: rgba(255,92,108,0.15); color: var(--error); }

  .bank-total {
    text-align: center;
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--gold);
    margin: 10px 0 4px;
  }
  .bank-sub {
    text-align: center;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .bank-sub span { color: var(--text); font-weight: 600; }

  .bank-expense-info {
    text-align: center;
    font-size: 0.85rem;
    margin-bottom: 16px;
    padding: 8px 12px;
    border-radius: 8px;
    background: rgba(255,184,107,0.08);
    border: 1px solid rgba(255,184,107,0.25);
    color: var(--warning);
  }
  .bank-expense-info.paid {
    background: rgba(74,222,128,0.08);
    border-color: rgba(74,222,128,0.25);
    color: var(--success);
  }
  .bank-expense-info b { color: var(--text); }

  .bank-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
    justify-content: center;
  }

  .bank-player {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .bank-player.fired {
    background: #1a1a22;
    border-color: #2a2a38;
    opacity: 0.75;
  }
  .bank-player.fired .bp-name { color: var(--fired); text-decoration: line-through; }

  .bank-player .bp-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }
  .bank-player .bp-name { font-weight: 600; }

  .bank-player .bp-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .bank-player .bp-stats span b { color: var(--text); font-weight: 600; }

  .bp-stats.balance-positive span b { color: var(--success); }
  .bp-stats.balance-zero span b { color: var(--text); }
  .bp-stats.balance-negative span,
  .bp-stats.balance-negative span b { color: var(--error) !important; }

  .bank-player .bp-controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .bank-player .bp-controls input { width: 110px; }

  .date-display-big {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 600;
    margin-bottom: 18px;
    color: var(--text);
  }
  .date-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 18px;
  }
  .date-actions button { min-width: 150px; }

  .empty { color: var(--text-dim); font-style: italic; padding: 12px; text-align: center; }
  .section-title { font-size: 0.9rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin: 18px 0 8px; }

  .history-item {
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
  }
  .history-item .hist-date { color: var(--text-dim); }

  .expense-total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    font-size: 1.05rem;
  }
  .expense-total-row b { color: var(--gold); }

  .dialog-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    z-index: 300;
  }
  .dialog {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    animation: fadeIn 0.15s ease;
  }
  .dialog p { margin-bottom: 20px; font-size: 0.98rem; line-height: 1.5; }
  .dialog .dialog-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

  @media (max-width: 480px) {
    .modal { padding: 18px; }
    .bank-total { font-size: 1.9rem; }
    .main-menu button { padding: 14px 20px; min-width: 110px; font-size: 0.95rem; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div></div>
  <div class="date-line" id="topbar-date">—</div>
</div>

<div class="main-menu">
  <button data-modal="members">Состав</button>
  <button data-modal="date">Дата</button>
  <button data-modal="bank">Банк</button>
  <button data-modal="inventory">Инвентарь</button>
  <button data-modal="business">Бизнес</button>
</div>

<!-- СОСТАВ -->
<div class="modal-overlay" id="modal-members" style="display:none;">
  <div class="modal">
    <button class="modal-close" data-close>×</button>
    <h2>Состав гильдии</h2>
    <div class="row">
      <div class="field" style="grid-column: span 2;">
        <label for="member-name">Имя</label>
        <input type="text" id="member-name" placeholder="Имя персонажа или НИП">
      </div>
      <div class="field">
        <label for="member-role">Должность</label>
        <select id="member-role">
          <option value="Управляющий">Управляющий</option>
          <option value="Игрок">Игрок</option>
          <option value="Сотрудник">Сотрудник</option>
          <option value="Наёмник">Наёмник</option>
        </select>
      </div>
    </div>
    <button id="btn-add-member">Добавить</button>
    <div class="error" id="members-error"></div>
    <div class="member-list" id="members-list"></div>
  </div>
</div>

<!-- ДАТА -->
<div class="modal-overlay" id="modal-date" style="display:none;">
  <div class="modal">
    <button class="modal-close" data-close>×</button>
    <h2>Дата и время</h2>
    <div class="date-display-big" id="date-display-big">—</div>
    <div class="date-actions">
      <button id="btn-short-rest" class="secondary">Короткий отдых (+1 ч)</button>
      <button id="btn-long-rest" class="secondary">Длительный отдых (+8 ч)</button>
      <button id="btn-next-day" class="secondary">Следующий день (07:00)</button>
    </div>
    <div class="section-title">Установить вручную</div>
    <div class="row">
      <div class="field">
        <label for="set-year">Год</label>
        <input type="number" id="set-year" min="1" step="1">
      </div>
      <div class="field">
        <label for="set-month">Месяц</label>
        <select id="set-month"></select>
      </div>
      <div class="field">
        <label for="set-day">День</label>
        <input type="number" id="set-day" min="1" max="31" step="1">
      </div>
      <div class="field">
        <label for="set-time">Время</label>
        <select id="set-time"></select>
      </div>
    </div>
    <button id="btn-set-date">Установить</button>
    <div class="error" id="date-error"></div>
  </div>
</div>

<!-- БАНК -->
<div class="modal-overlay" id="modal-bank" style="display:none;">
  <div class="modal">
    <button class="modal-close" data-close>×</button>
    <h2>Гильдийский банк</h2>
    <div class="bank-total" id="bank-total">0 ЗМ</div>
    <div class="bank-sub" id="bank-sub">Общих доходов: 0 · Общих трат: 0</div>
    <div class="bank-expense-info" id="bank-expense-info">—</div>
    <div class="bank-actions">
      <button id="btn-common-income" class="secondary">Общий доход</button>
      <button id="btn-common-expense" class="secondary">Общая трата</button>
      <button id="btn-expenses" class="secondary">Расходы</button>
      <button id="btn-history" class="secondary">История</button>
      <button id="btn-reset-bank" class="danger">Сбросить банк</button>
    </div>
    <div class="section-title">Вкладчики</div>
    <div id="bank-players"></div>
    <div class="error" id="bank-error"></div>
  </div>
</div>

<!-- ИСТОРИЯ -->
<div class="modal-overlay" id="modal-history" style="display:none;">
  <div class="modal">
    <button class="modal-close" data-close>×</button>
    <h2>История операций</h2>
    <div id="history-list" style="max-height: 420px; overflow-y: auto;"></div>
    <div class="error" id="history-error"></div>
  </div>
</div>

<!-- РАСХОДЫ -->
<div class="modal-overlay" id="modal-expenses" style="display:none;">
  <div class="modal">
    <button class="modal-close" data-close>×</button>
    <h2>Регулярные расходы</h2>
    <div class="row">
      <div class="field" style="grid-column: span 2;">
        <label for="expense-name">Направление</label>
        <input type="text" id="expense-name" placeholder="Зарплата персоналу">
      </div>
      <div class="field">
        <label for="expense-amount">Сумма</label>
        <input type="number" id="expense-amount" min="0" step="0.1">
      </div>
      <div class="field">
        <label for="expense-period">Периодичность</label>
        <select id="expense-period">
          <option value="daily">1 раз в сутки</option>
          <option value="monthly">1 раз в месяц</option>
        </select>
      </div>
    </div>
    <button id="btn-add-expense">Добавить</button>
    <div class="error" id="expenses-error"></div>
    <div class="section-title">Список расходов</div>
    <div id="expenses-list"></div>
    <div class="expense-total-row">
      <span>Итого в месяц:</span>
      <b id="expenses-total">0 ЗМ</b>
    </div>
    <div class="actions" style="margin-top: 16px;">
      <button id="btn-pay-expenses" class="warn">Оплатить</button>
    </div>
    <div class="error" id="pay-error"></div>
  </div>
</div>

<!-- ИНВЕНТАРЬ -->
<div class="modal-overlay" id="modal-inventory" style="display:none;">
  <div class="modal">
    <button class="modal-close" data-close>×</button>
    <h2>Инвентарь</h2>
    <div class="empty">Раздел в разработке 🛠️</div>
  </div>
</div>

<!-- БИЗНЕС -->
<div class="modal-overlay" id="modal-business" style="display:none;">
  <div class="modal">
    <button class="modal-close" data-close>×</button>
    <h2>Бизнес</h2>
    <div class="empty">Раздел в разработке 🛠️</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */

const STORAGE_KEY = 'mirtalis_state_v1';

const MONTHS = ['января','февраля','марта','апреля','мая','июня',
                'июля','августа','сентября','октября','ноября','декабря'];
const WEEKDAYS = ['Воскресенье','Понедельник','Вторник','Среда',
                  'Четверг','Пятница','Суббота'];
const DAYS_IN_MONTH = [31,28,31,30,31,30,31,31,30,31,30,31];

function defaultState() {
  return {
    date: { year: 1852, month: 11, day: 27, hours: 12, minutes: 30 },
    members: [],
    accounts: {},
    orphanFunds: 0,            // средства без вкладчика (после «Убрать»)
    totals: { commonIncome: 0, commonExpense: 0 },
    history: [],
    expenses: [],
    expensesPaidUntil: null    // { year, month } — до какого месяца оплачено включительно
  };
}

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const s = JSON.parse(raw);
    if (!s.date || !Array.isArray(s.members)) return defaultState();
    if (!s.accounts) s.accounts = {};
    if (typeof s.orphanFunds !== 'number') s.orphanFunds = 0;
    if (!s.totals) s.totals = { commonIncome: 0, commonExpense: 0 };
    if (!Array.isArray(s.history)) s.history = [];
    if (!Array.isArray(s.expenses)) s.expenses = [];
    if (!s.expensesPaidUntil) s.expensesPaidUntil = null;
    s.members.forEach(m => { if (typeof m.fired !== 'boolean') m.fired = false; });
    return s;
  } catch {
    return defaultState();
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* ============================================================
   ОКРУГЛЕНИЕ
   ============================================================ */

function floorTenths(x) { return Math.floor(x * 10) / 10; }
function roundTenths(x) { return Math.round(x * 10) / 10; }

function formatMoney(n) {
  const r = roundTenths(n);
  if (Number.isInteger(r)) return r + ' ЗМ';
  return r.toFixed(1) + ' ЗМ';
}

/* ============================================================
   ДАТА
   ============================================================ */

function formatDate(date) {
  const wd = WEEKDAYS[weekdayIndex(date)];
  const month = MONTHS[date.month - 1];
  const hh = String(date.hours).padStart(2, '0');
  const mm = String(date.minutes).padStart(2, '0');
  return `${wd}, ${date.day} ${month}, ${date.year} год. ${hh}:${mm}`;
}

function weekdayIndex(date) {
  let y = date.year, m = date.month;
  const d = date.day;
  if (m < 3) { m += 12; y -= 1; }
  const K = y % 100;
  const J = Math.floor(y / 100);
  let h = (d + Math.floor(13 * (m + 1) / 5) + K + Math.floor(K / 4) +
           Math.floor(J / 4) + 5 * J) % 7;
  const map = {0:6, 1:0, 2:1, 3:2, 4:3, 5:4, 6:5};
  return map[h];
}

function daysInMonth(month) { return DAYS_IN_MONTH[month - 1]; }

function addMinutes(date, minutes) {
  const d = { ...date };
  d.minutes += minutes;
  while (d.minutes >= 60) { d.minutes -= 60; d.hours += 1; }
  while (d.hours >= 24) { d.hours -= 24; d.day += 1; }
  while (d.day > daysInMonth(d.month)) {
    d.day -= daysInMonth(d.month);
    d.month += 1;
    if (d.month > 12) { d.month = 1; d.year += 1; }
  }
  return d;
}

function nextDayMorning(date) {
  const d = { ...date };
  d.day += 1;
  if (d.day > daysInMonth(d.month)) {
    d.day = 1; d.month += 1;
    if (d.month > 12) { d.month = 1; d.year += 1; }
  }
  d.hours = 7; d.minutes = 0;
  return d;
}

function updateDateDisplay() {
  const formatted = formatDate(state.date);
  $('topbar-date').innerHTML = formatted;
  $('date-display-big').textContent = formatted;
}

/* ============================================================
   ВСПОМОГАТЕЛЬНОЕ
   ============================================================ */

function showError(id, msg) { $(id).textContent = msg || ''; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }
function cssEscape(s) { return String(s).replace(/["\\]/g, '\\$&'); }

function ensureAccount(name) {
  if (!state.accounts[name]) {
    state.accounts[name] = { personalIn: 0, personalOut: 0, commonShare: 0, commonExpenseShare: 0 };
  }
  return state.accounts[name];
}

/* ============================================================
   КАСТОМНЫЕ ДИАЛОГИ
   ============================================================ */

function showConfirm(message, okText = 'Да', cancelText = 'Отмена') {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'dialog-overlay';
    overlay.innerHTML = `
      <div class="dialog">
        <p>${escapeHtml(message)}</p>
        <div class="dialog-actions">
          <button class="secondary" data-cancel>${cancelText}</button>
          <button data-ok>${okText}</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.querySelector('[data-ok]').addEventListener('click', () => {
      overlay.remove(); resolve(true);
    });
    overlay.querySelector('[data-cancel]').addEventListener('click', () => {
      overlay.remove(); resolve(false);
    });
    overlay.addEventListener('click', e => {
      if (e.target === overlay) { overlay.remove(); resolve(false); }
    });
  });
}

function showPrompt(message, defaultValue = '') {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'dialog-overlay';
    overlay.innerHTML = `
      <div class="dialog">
        <p>${escapeHtml(message)}</p>
        <input type="text" id="dialog-input" value="${escapeAttr(defaultValue)}" style="margin-bottom: 16px;">
        <div class="dialog-actions">
          <button class="secondary" data-cancel>Отмена</button>
          <button data-ok>OK</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const input = overlay.querySelector('#dialog-input');
    input.focus();
    input.select();
    const close = val => { overlay.remove(); resolve(val); };
    overlay.querySelector('[data-ok]').addEventListener('click', () => close(input.value));
    overlay.querySelector('[data-cancel]').addEventListener('click', () => close(null));
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') close(input.value);
      if (e.key === 'Escape') close(null);
    });
    overlay.addEventListener('click', e => {
      if (e.target === overlay) close(null);
    });
  });
}

/* ============================================================
   ИСТОРИЯ
   ============================================================ */

function logHistory(text) {
  const d = state.date;
  const dateStr = `${d.day} ${MONTHS[d.month - 1]}`;
  state.history.unshift({ date: dateStr, text });
  if (state.history.length > 300) state.history.pop();
  saveState();
}

function renderHistory() {
  const list = $('history-list');
  if (!state.history.length) {
    list.innerHTML = '<div class="empty">История пуста</div>';
    return;
  }
  list.innerHTML = state.history.map(h =>
    `<div class="history-item"><span class="hist-date">${escapeHtml(h.date)}.</span> ${escapeHtml(h.text)}</div>`
  ).join('');
}

/* ============================================================
   СОСТАВ
   ============================================================ */

const ROLE_ORDER = ['Управляющий', 'Игрок', 'Сотрудник', 'Наёмник'];
const ROLE_CLASS = {
  'Управляющий': 'role-manager',
  'Игрок': 'role-player',
  'Сотрудник': 'role-employee',
  'Наёмник': 'role-merc'
};

function getPlayers() {
  return state.members.filter(m => m.role === 'Игрок' && !m.fired);
}

function renderMembers() {
  const list = $('members-list');
  if (!state.members.length) {
    list.innerHTML = '<div class="empty">Пока никого нет</div>';
    return;
  }
  const sorted = [...state.members].sort((a, b) => {
    if (a.fired !== b.fired) return a.fired ? 1 : -1;
    return ROLE_ORDER.indexOf(a.role) - ROLE_ORDER.indexOf(b.role);
  });
  list.innerHTML = '';
  sorted.forEach(m => {
    const row = document.createElement('div');
    row.className = 'member-row' + (m.fired ? ' fired' : '');
    let btns = '';
    if (m.fired) {
      btns = `<button class="success-btn small" data-hire="${m.id}">Нанять</button>
              <button class="danger small" data-delete="${m.id}">Удалить</button>`;
    } else {
      btns = `<button class="danger small" data-fire="${m.id}">Уволить</button>`;
    }
    row.innerHTML = `
      <div>
        <span class="member-name">${escapeHtml(m.name)}</span>
        <span class="member-role ${ROLE_CLASS[m.role] || ''}">${m.role}</span>
      </div>
      <div style="display:flex; gap:6px;">${btns}</div>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('[data-fire]').forEach(btn => {
    btn.addEventListener('click', () => fireMember(btn.dataset.fire));
  });
  list.querySelectorAll('[data-hire]').forEach(btn => {
    btn.addEventListener('click', () => hireMember(btn.dataset.hire));
  });
  list.querySelectorAll('[data-delete]').forEach(btn => {
    btn.addEventListener('click', () => deleteMember(btn.dataset.delete));
  });
}

function addMember(name, role) {
  name = name.trim();
  if (!name) { showError('members-error', 'Введите имя'); return; }
  const existing = state.members.find(m => m.name.toLowerCase() === name.toLowerCase());
  if (existing) {
    if (existing.fired) {
      existing.fired = false;
      existing.role = role;
      saveState();
      showError('members-error', '');
      $('member-name').value = '';
      renderMembers();
      renderBank();
      return;
    }
    showError('members-error', 'Персонаж с таким именем уже есть');
    return;
  }
  state.members.push({ id: Date.now() + '_' + Math.random().toString(36).slice(2, 7), name, role, fired: false });
  if (role === 'Игрок') ensureAccount(name);
  saveState();
  showError('members-error', '');
  $('member-name').value = '';
  renderMembers();
  renderBank();
}

async function fireMember(id) {
  const idx = state.members.findIndex(m => m.id === id);
  if (idx === -1) return;
  const m = state.members[idx];
  const balance = state.accounts[m.name] ? getAccountBalance(m.name) : 0;

  const ok = await showConfirm(`Уволить сотрудника «${m.name}»?`);
  if (!ok) return;

  if (m.role === 'Игрок' && balance !== 0) {
    const give = await showConfirm(`У сотрудника вклад в банке: ${formatMoney(balance)}. Выдать?`);
    if (give) {
      ensureAccount(m.name).personalIn -= balance;
      logHistory(`Игрок ${m.name} забрал вклад при увольнении: ${formatMoney(balance)}`);
    }
  }

  m.fired = true;
  saveState();
  renderMembers();
  renderBank();
}

function hireMember(id) {
  const m = state.members.find(x => x.id === id);
  if (!m) return;
  m.fired = false;
  if (m.role === 'Игрок') ensureAccount(m.name);
  saveState();
  renderMembers();
  renderBank();
}

async function deleteMember(id) {
  const m = state.members.find(x => x.id === id);
  if (!m) return;
  const ok = await showConfirm(`Удалить «${m.name}» навсегда? Это действие необратимо.`, 'Удалить', 'Отмена');
  if (!ok) return;

  state.members = state.members.filter(x => x.id !== id);
  saveState();
  renderMembers();
  renderBank();
}

/* ============================================================
   БАНК
   ============================================================ */

function getAccountBalance(name) {
  const a = state.accounts[name];
  if (!a) return 0;
  return a.personalIn - a.personalOut + a.commonShare - a.commonExpenseShare;
}

function getTotalAccounts() {
  let sum = 0;
  for (const name in state.accounts) sum += getAccountBalance(name);
  return sum;
}

function getBankTotal() {
  return getTotalAccounts() + (state.orphanFunds || 0);
}

function getPositiveTotal() {
  let sum = 0;
  for (const name in state.accounts) {
    const b = getAccountBalance(name);
    if (b > 0) sum += b;
  }
  return sum;
}

function renderBank() {
  const total = getBankTotal();
  $('bank-total').textContent = formatMoney(total);
  const orphan = state.orphanFunds || 0;
  $('bank-sub').innerHTML =
    `Общих доходов: <span>${formatMoney(state.totals.commonIncome)}</span> · ` +
    `Общих трат: <span>${formatMoney(state.totals.commonExpense)}</span>` +
    (orphan > 0 ? ` · Средства без вкладчика: <span>${formatMoney(orphan)}</span>` : '');

  renderExpenseInfo();

  const names = new Set();
  state.members.forEach(m => { if (m.role === 'Игрок') names.add(m.name); });
  Object.keys(state.accounts).forEach(n => names.add(n));

  const container = $('bank-players');
  if (!names.size) {
    container.innerHTML = '<div class="empty">Нет игроков в составе</div>';
    return;
  }

  const positiveTotal = getPositiveTotal();

  const arr = Array.from(names).map(name => {
    const member = state.members.find(m => m.name === name);
    const fired = member ? member.fired : true;
    return { name, fired, member };
  });
  arr.sort((a, b) => {
    if (a.fired !== b.fired) return a.fired ? 1 : -1;
    return a.name.localeCompare(b.name);
  });

  container.innerHTML = '';
  arr.forEach(({ name, fired }) => {
    const balance = getAccountBalance(name);
    const share = (balance > 0 && positiveTotal > 0) ? (balance / positiveTotal * 100) : 0;
    const limit = Math.max(0, Math.min(balance, total));

    let balanceClass, balanceLabel;
    if (balance > 0) { balanceClass = 'balance-positive'; balanceLabel = 'Счёт'; }
    else if (balance < 0) { balanceClass = 'balance-negative'; balanceLabel = 'Долг'; }
    else { balanceClass = 'balance-zero'; balanceLabel = 'Счёт'; }

    const div = document.createElement('div');
    div.className = 'bank-player' + (fired ? ' fired' : '');
    const statsClass = 'bp-stats ' + balanceClass;

    const controls = !fired
      ? `<div class="bp-controls">
           <input type="number" min="0" step="1" placeholder="Сумма" data-amount="${escapeAttr(name)}">
           <button class="small" data-deposit="${escapeAttr(name)}">Вложить</button>
           <button class="small secondary" data-withdraw="${escapeAttr(name)}">Снять</button>
         </div>`
      : `<div class="bp-controls">
           <button class="danger small" data-remove-account="${escapeAttr(name)}">Убрать</button>
         </div>`;

    div.innerHTML = `
      <div class="bp-head">
        <span class="bp-name">${escapeHtml(name)}${fired ? ' (не в составе)' : ''}</span>
      </div>
      <div class="${statsClass}">
        <span>${balanceLabel}: <b>${formatMoney(balance)}</b></span>
        <span>Доля: <b>${share.toFixed(1)}%</b></span>
        <span>Лимит: <b>${formatMoney(limit)}</b></span>
      </div>
      ${controls}
    `;
    container.appendChild(div);
  });

  container.querySelectorAll('[data-deposit]').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.deposit;
      const input = container.querySelector(`[data-amount="${cssEscape(name)}"]`);
      const val = parseFloat(input.value);
      if (isNaN(val) || val <= 0) { showError('bank-error', 'Введите сумму больше 0'); return; }
      deposit(name, val);
      input.value = '';
    });
  });
  container.querySelectorAll('[data-withdraw]').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.withdraw;
      const input = container.querySelector(`[data-amount="${cssEscape(name)}"]`);
      const val = parseFloat(input.value);
      if (isNaN(val) || val <= 0) { showError('bank-error', 'Введите сумму больше 0'); return; }
      withdraw(name, val);
      input.value = '';
    });
  });
  container.querySelectorAll('[data-remove-account]').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.removeAccount;
      const balance = getAccountBalance(name);
      // Деньги не исчезают — переходят в «средства без вкладчика»
      if (balance !== 0) {
        state.orphanFunds = (state.orphanFunds || 0) + balance;
        logHistory(`Вклад игрока ${name} (${formatMoney(balance)}) перешёл в средства без вкладчика`);
      }
      delete state.accounts[name];
      saveState();
      renderBank();
      showError('bank-error', '');
    });
  });
}

function deposit(name, amount) {
  showError('bank-error', '');
  const acc = ensureAccount(name);
  acc.personalIn += amount;
  logHistory(`Игрок ${name} сделал личный вклад ${formatMoney(amount)}`);
  saveState();
  renderBank();
}

async function withdraw(name, amount) {
  showError('bank-error', '');
  const acc = ensureAccount(name);
  const balance = getAccountBalance(name);
  const bank = getBankTotal();
  const limit = Math.max(0, Math.min(balance, bank));

  if (amount > bank) { showError('bank-error', 'В банке недостаточно средств'); return; }

  if (amount > limit) {
    const ok = await showConfirm(`Сумма превышает лимит (${formatMoney(limit)}). Согласовано с игроками?`);
    if (!ok) return;
  }

  acc.personalOut += amount;
  logHistory(`Игрок ${name} снял ${formatMoney(amount)}`);
  saveState();
  renderBank();
}

function commonIncome(amount) {
  showError('bank-error', '');
  const players = getPlayers();
  if (!players.length) { showError('bank-error', 'Нет игроков'); return; }
  if (amount <= 0) { showError('bank-error', 'Сумма должна быть > 0'); return; }
  const per = floorTenths(amount / players.length);
  players.forEach(p => {
    ensureAccount(p.name).commonShare += per;
  });
  const distributed = per * players.length;
  state.totals.commonIncome += distributed;
  logHistory(`Гильдия пополнила счёт на ${formatMoney(distributed)}`);
  saveState();
  renderBank();
}

function commonExpense(amount) {
  showError('bank-error', '');
  const players = getPlayers();
  if (!players.length) { showError('bank-error', 'Нет игроков'); return; }
  if (amount <= 0) { showError('bank-error', 'Сумма должна быть > 0'); return; }
  const bank = getBankTotal();
  if (amount > bank) { showError('bank-error', 'В банке недостаточно средств'); return; }
  const per = floorTenths(amount / players.length);
  players.forEach(p => {
    ensureAccount(p.name).commonExpenseShare += per;
  });
  const distributed = per * players.length;
  state.totals.commonExpense += distributed;
  logHistory(`Гильдия потратила со счёта ${formatMoney(distributed)}`);
  saveState();
  renderBank();
}

async function resetBank() {
  const ok = await showConfirm('Сбросить банк полностью? Все счета (включая удалённых вкладчиков), долги, общие суммы и история операций будут стёрты. Состав гильдии останется.');
  if (!ok) return;
  state.accounts = {};
  state.orphanFunds = 0;
  getPlayers().forEach(p => ensureAccount(p.name));
  state.totals = { commonIncome: 0, commonExpense: 0 };
  state.history = [];
  state.expensesPaidUntil = null;
  saveState();
  renderBank();
  showError('bank-error', '');
}

/* ============================================================
   РАСХОДЫ
   ============================================================ */

function getMonthlyExpensesTotal() {
  let total = 0;
  state.expenses.forEach(e => {
    total += e.period === 'daily' ? e.amount * 30 : e.amount;
  });
  return total;
}

// Проверка: оплачен ли текущий месяц
function isCurrentMonthPaid() {
  if (!state.expensesPaidUntil) return false;
  const d = state.date;
  const p = state.expensesPaidUntil;
  return (p.year > d.year) || (p.year === d.year && p.month >= d.month);
}

function renderExpenseInfo() {
  const info = $('bank-expense-info');
  const total = getMonthlyExpensesTotal();
  if (total <= 0) {
    info.style.display = 'none';
    info.textContent = '';
    return;
  }
  info.style.display = 'block';

  if (isCurrentMonthPaid()) {
    const p = state.expensesPaidUntil;
    info.className = 'bank-expense-info paid';
    info.innerHTML = `Расходы оплачены до <b>${MONTHS[p.month - 1]} ${p.year}</b>`;
  } else {
    const d = state.date;
    const daysLeft = daysInMonth(d.month) - d.day + 1;
    info.className = 'bank-expense-info';
    info.innerHTML = `Необходимо внести <b>${formatMoney(total)}</b> на расходы Гильдии в течение <b>${daysLeft}</b> дн.`;
  }
}

function renderExpenses() {
  const list = $('expenses-list');
  if (!state.expenses.length) {
    list.innerHTML = '<div class="empty">Нет расходов</div>';
    $('expenses-total').textContent = '0 ЗМ';
    return;
  }
  let total = 0;
  list.innerHTML = state.expenses.map((e, i) => {
    const monthly = e.period === 'daily' ? e.amount * 30 : e.amount;
    total += monthly;
    return `<div class="member-row">
      <div>
        <span class="member-name">${escapeHtml(e.name)}</span>
        <span style="font-size: 0.8rem; color: var(--text-dim); margin-left: 8px;">
          ${formatMoney(e.amount)} ${e.period === 'daily' ? 'в сутки' : 'в месяц'}
        </span>
      </div>
      <button class="danger small" data-del-expense="${i}">Удалить</button>
    </div>`;
  }).join('');
  $('expenses-total').textContent = formatMoney(total);
  list.querySelectorAll('[data-del-expense]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.expenses.splice(parseInt(btn.dataset.delExpense, 10), 1);
      saveState();
      renderExpenses();
      renderBank();
    });
  });
}

$('btn-add-expense').addEventListener('click', () => {
  showError('expenses-error', '');
  const name = $('expense-name').value.trim();
  const amount = parseFloat($('expense-amount').value);
  const period = $('expense-period').value;
  if (!name) { showError('expenses-error', 'Введите направление'); return; }
  if (isNaN(amount) || amount <= 0) { showError('expenses-error', 'Сумма должна быть > 0'); return; }
  state.expenses.push({ name, amount, period });
  saveState();
  $('expense-name').value = '';
  $('expense-amount').value = '';
  renderExpenses();
  renderBank();
});

// Оплата расходов
async function payExpenses() {
  showError('pay-error', '');
  const total = getMonthlyExpensesTotal();
  if (total <= 0) { showError('pay-error', 'Нет расходов для оплаты'); return; }
  const bank = getBankTotal();
  if (total > bank) { showError('pay-error', 'В банке недостаточно средств'); return; }

  // Сначала снимаем с «средств без вкладчика», если есть
  let remaining = total;
  if (state.orphanFunds > 0) {
    const take = Math.min(state.orphanFunds, remaining);
    state.orphanFunds -= take;
    remaining -= take;
  }
  // Остаток — как общая трата (поровну на игроков)
  if (remaining > 0) {
    const players = getPlayers();
    if (!players.length) { showError('pay-error', 'Нет игроков для распределения траты'); return; }
    const per = floorTenths(remaining / players.length);
    players.forEach(p => {
      ensureAccount(p.name).commonExpenseShare += per;
    });
    state.totals.commonExpense += per * players.length;
  } else {
    state.totals.commonExpense += total;
  }

  // Сдвигаем дату оплаты
  const d = state.date;
  if (!state.expensesPaidUntil) {
    // Первая оплата — за следующий месяц
    let m = d.month + 1, y = d.year;
    if (m > 12) { m = 1; y += 1; }
    state.expensesPaidUntil = { year: y, month: m };
  } else {
    // Следующий месяц после уже оплаченного
    let m = state.expensesPaidUntil.month + 1, y = state.expensesPaidUntil.year;
    if (m > 12) { m = 1; y += 1; }
    state.expensesPaidUntil = { year: y, month: m };
  }

  logHistory(`Гильдия оплатила расходы: ${formatMoney(total)}`);
  saveState();
  renderBank();
  renderExpenses();
  renderExpenseInfo();
}

$('btn-pay-expenses').addEventListener('click', payExpenses);

function fillDateInputs() {
  $('set-year').value = state.date.year;
  $('set-month').value = state.date.month;
  $('set-day').value = state.date.day;
  const t = String(state.date.hours).padStart(2,'0') + ':' + String(state.date.minutes).padStart(2,'0');
  $('set-time').value = t;
}

(function initDateSelects() {
  const monthSel = $('set-month');
  MONTHS.forEach((m, i) => {
    const opt = document.createElement('option');
    opt.value = i + 1;
    opt.textContent = m.charAt(0).toUpperCase() + m.slice(1);
    monthSel.appendChild(opt);
  });
  const timeSel = $('set-time');
  for (let h = 0; h < 24; h++) {
    for (let m = 0; m < 60; m += 30) {
      const val = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
      const opt = document.createElement('option');
      opt.value = val;
      opt.textContent = val;
      timeSel.appendChild(opt);
    }
  }
})();

$('btn-short-rest').addEventListener('click', () => {
  state.date = addMinutes(state.date, 60);
  saveState(); updateDateDisplay(); fillDateInputs(); renderExpenseInfo();
});

$('btn-long-rest').addEventListener('click', () => {
  state.date = addMinutes(state.date, 8 * 60);
  saveState(); updateDateDisplay(); fillDateInputs(); renderExpenseInfo();
});

$('btn-next-day').addEventListener('click', () => {
  state.date = nextDayMorning(state.date);
  saveState(); updateDateDisplay(); fillDateInputs(); renderExpenseInfo();
});

$('btn-set-date').addEventListener('click', () => {
  showError('date-error', '');
  const year = parseInt($('set-year').value, 10);
  const month = parseInt($('set-month').value, 10);
  const day = parseInt($('set-day').value, 10);
  const time = $('set-time').value;
  const [hh, mm] = time.split(':').map(Number);

  if (!Number.isInteger(year) || year < 1) { showError('date-error', 'Год должен быть ≥ 1'); return; }
  if (!Number.isInteger(month) || month < 1 || month > 12) { showError('date-error', 'Месяц от 1 до 12'); return; }
  const maxDay = daysInMonth(month);
  if (!Number.isInteger(day) || day < 1 || day > maxDay) {
    showError('date-error', `В этом месяце ${maxDay} дней`);
    return;
  }
  state.date = { year, month, day, hours: hh, minutes: mm };
  saveState(); updateDateDisplay(); fillDateInputs(); renderExpenseInfo();
});

/* ============================================================
   БАНК — обработчики
   ============================================================ */

$('btn-common-income').addEventListener('click', async () => {
  const val = await showPrompt('Сумма общего дохода (ЗМ):');
  if (val === null) return;
  const num = parseFloat(val);
  if (isNaN(num) || num <= 0) return;
  commonIncome(num);
});

$('btn-common-expense').addEventListener('click', async () => {
  const val = await showPrompt('Сумма общей траты (ЗМ):');
  if (val === null) return;
  const num = parseFloat(val);
  if (isNaN(num) || num <= 0) return;
  commonExpense(num);
});

$('btn-history').addEventListener('click', () => openModal('history'));
$('btn-expenses').addEventListener('click', () => openModal('expenses'));
$('btn-reset-bank').addEventListener('click', resetBank);

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */

updateDateDisplay();
renderMembers();
renderBank();
</script>
</body>
</html>
